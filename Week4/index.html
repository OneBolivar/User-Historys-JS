<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica JS - Gestión de Productos</title>

</head>
<body>

    <h1>Gestión de Productos (Practica SPA / DOM)</h1>

    <!-- Contenedor para mensajes de éxito o error -->
    <div id="mensaje-feedback"></div>

    <!-- Formulario de captura (TASK 1 y 2) -->
    <form id="formulario-producto">
        <input type="text" id="nombre" placeholder="Nombre del producto">
        <input type="number" id="precio" placeholder="Precio">
        <input type="text" id="descripcion" placeholder="Descripción">
        <button type="submit">Agregar Producto</button>
    </form>

    <!-- Botón para sincronizar con el servidor (TASK 5) -->
    <button id="btn-sincronizar">Sincronizar con API</button>

    <h2>Lista de Productos</h2>
    <!-- Lista dinámica (TASK 3) -->
    <ul id="lista-productos"></ul>

    <!-- Enlace al archivo de JavaScript (TASK 1) -->
    <script src="app.js"></script>
</body>
</html>
