<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="/Week4/assets/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Desempeño - Gestión de Productos</title>
    <link rel="stylesheet" href="styles.css"> <!-- O tu ruta de CSS -->
</head>
<body>

    <h1>Registro de Productos</h1>

    <!-- Contenedor para mensajes de éxito o error -->
    <div id="contenedor-mensaje"></div>

    <!-- Formulario de captura de datos (Actualizado con Cantidad) -->
    <form id="formulario-producto">
        <div>
            <label for="nombre">Nombre del Producto:</label>
            <input type="text" id="nombre">
        </div>
        <div>
            <label for="precio">Precio ($):</label>
            <input type="number" id="precio" step="0.01">
        </div>
        <div>
            <!-- CAMBIO: De Descripción a Cantidad -->
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" min="1">
        </div>
        <button type="submit">Guardar Producto</button>
    </form>

    <!-- Botón para simular o ejecutar la sincronización con la API (TASK 5) -->
    <button id="btn-sincronizar" type="button">Sincronizar con Servidor</button>

    <h2>Productos Registrados</h2>
    <ul id="lista-productos"></ul>

    <!-- Tu ruta corregida -->
    <script src="/Week4/assets/js/app.js"></script>
</body>
</html>
